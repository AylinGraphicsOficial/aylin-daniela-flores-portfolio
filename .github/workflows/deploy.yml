name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Compile Production Bundle
        run: npm run build

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 151.106.96.65
          username: u888615463
          password: ${{ secrets.FTP_PASSWORD || 'Aylin2026.' }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: domains/aylinflores.com/public_html/
          dangerous-clean-slate: false
